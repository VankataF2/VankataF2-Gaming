
name: Fortnite Rewards and Leaks

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fortnite-leaks
  cancel-in-progress: false

jobs:
  update-leaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Fortnite leaks
        run: python scripts/update_rewards.py

      - name: Save leaks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaks.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Fortnite leaks"
            git push
          fi
