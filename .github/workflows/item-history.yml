
name: Update Fortnite Item History

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Item Shop history
        env:
          ITEMSHOP_API_KEY: ${{ secrets.ITEMSHOP_API_KEY }}
        run: python scripts/update_item_history.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add item-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Fortnite item history"
            git push
          fi

