name: Обновяване на Fortnite новини
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_news.py
        env:
          HYPEX_RSS_URLS: ${{ vars.HYPEX_RSS_URLS }}
      - name: Запази новините
        run: |
          if [ -f news.json ] && [ -n "$(git status --porcelain -- news.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m 'Update Fortnite news'
            git push
          fi
