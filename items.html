
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortnite Item Search | VANKATA GAMING</title>
<style>
:root{
  --bg:#090b17;--panel:#171e35;
  --cyan:#29e0e7;--purple:#9560ff;
  --muted:#b2b7cc
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:35px 16px;background:#141a30;border-bottom:1px solid #394164}
h1{font-size:clamp(27px,5vw,43px);margin:10px 0}
header p,.note{color:var(--muted)}
a{color:var(--cyan)}
main{max-width:1200px;margin:auto;padding:28px 16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:25px}
input,select{
  background:#202943;color:white;border:1px solid #495377;
  padding:15px;border-radius:12px;font-size:16px
}
input{flex:1;min-width:190px}
button{
  padding:15px 23px;background:linear-gradient(120deg,#9560ff,#5555ee);
  color:white;border:0;border-radius:12px;font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(1.15)}
#status{color:var(--muted);text-align:center;margin:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:19px}
.card{background:var(--panel);border:1px solid #37415d;border-radius:17px;overflow:hidden}
.card img{
  display:block;width:100%;height:235px;object-fit:contain;
  background:radial-gradient(circle,#39305d,#14192b)
}
.info{padding:17px}
.info h2{font-size:20px;margin:0 0 10px}
.info p{font-size:14px;color:#c5cce0;line-height:1.5}
.type{color:var(--cyan)!important;font-weight:bold}
.price{color:#ffe59a!important;font-weight:bold}
.note{text-align:center;font-size:13px;line-height:1.6;margin-top:30px}
@media(max-width:550px){
  .controls{flex-direction:column}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card img{height:170px}
  .info{padding:11px}
  .info h2{font-size:16px}
}
</style>
</head>
<body>
<header>
  <h1>🔍 FORTNITE ITEM SEARCH</h1>
  <p>Скинове, кирки, емоути, раници и още!</p>
  <a href="./index.html">← VANKATA GAMING</a>
</header>

<main>
  <form id="searchForm" class="controls">
    <input id="itemName" placeholder="Например: Midas, Aura, Star Wand..." minlength="2" required>
    <select id="category">
      <option value="">🎮 Всички категории</option>
      <option value="outfit">👕 Скинове</option>
      <option value="pickaxe">⛏️ Кирки</option>
      <option value="backbling">🎒 Раници</option>
      <option value="emote">💃 Емоути</option>
      <option value="glider">🪂 Глайдери</option>
      <option value="wrap">🔫 Wraps</option>
      <option value="music">🎵 Музика</option>
    </select>
    <button type="submit">🔍 Търси</button>
  </form>

  <p id="status">Въведи име на предмет.</p>
  <div id="results" class="grid"></div>
  <p class="note">
    Данни от Fortnite-API. Показаната цена е от
    текущия магазин, когато е налична.
    Липсата на цена не означава, че предметът е безплатен.
  </p>
</main>

<script>
const form=document.getElementById("searchForm");
const input=document.getElementById("itemName");
const category=document.getElementById("category");
const results=document.getElementById("results");
const statusEl=document.getElementById("status");

let searchController=null;
let shopPromise=null;

const typeNames={
  outfit:"Скин",pickaxe:"Кирка",backbling:"Раница",
  emote:"Емоут",glider:"Глайдер",wrap:"Wrap",
  music:"Музика",loadingscreen:"Loading Screen",
  contrail:"Contrail",spray:"Spray"
};

function text(parent,tag,value,cls){
  const el=document.createElement(tag);
  el.textContent=value;
  if(cls)el.className=cls;
  parent.appendChild(el);
}

function dateBG(value){
  if(!value)return null;
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return null;
  return d.toLocaleDateString("bg-BG");
}

function shopIndex(shop){
  const map=new Map();
  for(const entry of shop.entries||[]){
    const price=entry.finalPrice ?? entry.regularPrice;
    for(const item of [
      ...(entry.brItems||[]),
      ...(entry.tracks||[]),
      ...(entry.instruments||[]),
      ...(entry.cars||[])
    ]){
      if(item && item.id){
        map.set(item.id,{price,entry});
      }
    }
  }
  return map;
}

async function getShop(signal){
  if(!shopPromise){
    shopPromise=fetch("https://fortnite-api.com/v2/shop")
      .then(r=>{
        if(!r.ok)throw new Error("Shop HTTP "+r.status);
        return r.json();
      })
      .then(json=>shopIndex(json.data||{}))
      .catch(error=>{
        shopPromise=null;
        console.warn("Shop unavailable",error);
        return new Map();
      });
  }
  return shopPromise;
}

function showItem(item,shop){
  const card=document.createElement("article");
  card.className="card";

  const image=item.images?.featured||
              item.images?.icon||
              item.images?.smallIcon;

  if(image){
    const img=document.createElement("img");
    img.src=image;
    img.alt=item.name||"Fortnite предмет";
    img.loading="lazy";
    card.appendChild(img);
  }

  const info=document.createElement("div");
  info.className="info";

  text(info,"h2",item.name||"Неизвестен предмет");

  const type=item.type?.value||"";
  text(
    info,"p",
    "Категория: "+(typeNames[type.toLowerCase()]||
      item.type?.displayValue||"Друга"),
    "type"
  );

  const rarity=item.series?.name||
               item.rarity?.displayValue||
               "Неизвестна";
  text(info,"p","Рядкост: "+rarity);

  if(item.description){
    text(info,"p",item.description);
  }

  const offer=shop.get(item.id);
  if(offer && Number.isFinite(offer.price)){
    text(
      info,"p",
      "🪙 Цена в магазина: "+
      offer.price.toLocaleString("en-US")+
      " V-Bucks",
      "price"
    );
    text(info,"p","🟢 В текущия Item Shop");
  }else{
    text(info,"p","Цена: няма текуща оферта");
  }

  const history=Array.isArray(item.shopHistory)
    ?item.shopHistory:[];
  if(history.length){
    const latest=history
      .map(x=>new Date(x))
      .filter(d=>!Number.isNaN(d.getTime()))
      .sort((a,b)=>b-a)[0];
    if(latest){
      text(
        info,"p",
        "📅 Последна поява: "+
        latest.toLocaleDateString("bg-BG")
      );
    }
  }else{
    text(info,"p","📅 Последна поява: няма данни");
  }

  if(item.introduction?.text){
    text(info,"p",item.introduction.text);
  }

  card.appendChild(info);
  results.appendChild(card);
}

async function searchItems(query){
  if(searchController)searchController.abort();
  searchController=new AbortController();
  const signal=searchController.signal;

  results.replaceChildren();
  statusEl.textContent="⏳ Търсене на предмети...";

  const params=new URLSearchParams({
    name:query,
    matchMethod:"contains",
    language:"en",
    searchLanguage:"en"
  });

  if(category.value){
    params.set("type",category.value);
  }

  try{
    const response=await fetch(
      "https://fortnite-api.com/v2/cosmetics/br/search/all?"+params,
      {signal}
    );

    if(response.status===404){
      statusEl.textContent="Няма намерени предмети.";
      return;
    }
    if(!response.ok){
      throw new Error("Search HTTP "+response.status);
    }

    const json=await response.json();
    const items=Array.isArray(json.data)?json.data:[];

    if(signal.aborted)return;

    if(!items.length){
      statusEl.textContent="Няма намерени предмети.";
      return;
    }

    statusEl.textContent="⏳ Намерени "+items.length+
      " предмета. Зареждане на цени...";

    const shop=await getShop(signal);
    if(signal.aborted)return;

    results.replaceChildren();
    items.slice(0,80).forEach(item=>showItem(item,shop));

    statusEl.textContent="🎮 Намерени предмети: "+items.length;
    if(items.length>80){
      statusEl.textContent+=" (показани първите 80)";
    }
  }catch(error){
    if(error.name==="AbortError")return;
    console.error(error);
    statusEl.textContent=
      "❌ Грешка при търсене. Опитай отново.";
  }
}

form.addEventListener("submit",event=>{
  event.preventDefault();
  const query=input.value.trim();
  if(query.length>=2)searchItems(query);
});
</script>
</body>
</html>
