
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortnite Item Search | VANKATA GAMING</title>
<style>
:root{
  --bg:#090b17;
  --panel:#171e35;
  --cyan:#29e0e7;
  --purple:#9560ff;
  --muted:#b2b7cc;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:white;
  font-family:Arial,sans-serif
}
header{
  text-align:center;padding:35px 16px;
  background:#141a30;border-bottom:1px solid #394164
}
h1{font-size:clamp(27px,5vw,43px);margin:10px 0}
header p,.note{color:var(--muted)}
a{color:var(--cyan)}
main{max-width:1200px;margin:auto;padding:28px 16px}
.controls{
  display:flex;flex-wrap:wrap;gap:12px;margin-bottom:25px
}
input,select{
  background:#202943;color:white;border:1px solid #495377;
  padding:15px;border-radius:12px;font-size:16px
}
input{flex:1;min-width:190px}
button{
  padding:15px 23px;
  background:linear-gradient(120deg,#9560ff,#5555ee);
  color:white;border:0;border-radius:12px;
  font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(1.15)}
#status{
  color:var(--muted);text-align:center;
  margin:22px;line-height:1.6
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:19px
}
.card{
  background:var(--panel);
  border:1px solid #37415d;
  border-radius:17px;overflow:hidden
}
.card img{
  display:block;width:100%;height:235px;object-fit:contain;
  background:radial-gradient(circle,#39305d,#14192b)
}
.info{padding:17px}
.info h2{font-size:20px;margin:0 0 10px}
.info p{
  font-size:14px;color:#c5cce0;line-height:1.5
}
.type{color:var(--cyan)!important;font-weight:bold}
.price{color:#ffe59a!important;font-weight:bold}
.last{color:#a8ffcc!important;font-weight:bold}
.warning{color:#ffbf8c!important}
.note{
  text-align:center;font-size:13px;
  line-height:1.6;margin-top:30px
}
@media(max-width:550px){
  .controls{flex-direction:column}
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px
  }
  .card img{height:170px}
  .info{padding:11px}
  .info h2{font-size:16px}
}
</style>
</head>
<body>

<header>
  <h1>🔍 FORTNITE ITEM SEARCH</h1>
  <p>Скинове, кирки, емоути, раници и още!</p>
  <a href="./index.html">← VANKATA GAMING</a>
</header>

<main>
  <form id="searchForm" class="controls">
    <input
      id="itemName"
      placeholder="Например: Star Wand, Web Slicer, Midas..."
      minlength="2"
      required
    >
    <select id="category">
      <option value="">🎮 Всички категории</option>
      <option value="outfit">👕 Скинове</option>
      <option value="pickaxe">⛏️ Кирки</option>
      <option value="backbling">🎒 Раници</option>
      <option value="emote">💃 Емоути</option>
      <option value="glider">🪂 Глайдери</option>
      <option value="wrap">🔫 Wraps</option>
      <option value="music">🎵 Музика</option>
    </select>
    <button type="submit">🔍 Търси</button>
  </form>

  <p id="status" aria-live="polite">
    Въведи име на предмет.
  </p>

  <div id="results" class="grid"></div>

  <p class="note">
    Историческите данни идват от item-history.json,
    обновяван чрез GitHub Actions.
    Последна записана поява не винаги означава
    последната действителна поява.
    Цените на пакети се обозначават отделно.
  </p>
</main>

<script>
'use strict';

const form=document.getElementById('searchForm');
const input=document.getElementById('itemName');
const category=document.getElementById('category');
const results=document.getElementById('results');
const statusEl=document.getElementById('status');

const typeNames={
  outfit:'Скин',
  pickaxe:'Кирка',
  backbling:'Раница',
  emote:'Емоут',
  glider:'Глайдер',
  wrap:'Wrap',
  music:'Музика'
};

let controller=null;
let historyPromise=null;

function add(parent,tag,value,cls){
  const element=document.createElement(tag);
  element.textContent=value;
  if(cls)element.className=cls;
  parent.appendChild(element);
  return element;
}

function normalize(value){
  return String(value||'')
    .trim()
    .toLowerCase();
}

function validPrice(value){
  if(value===null||value===undefined||value===''){
    return null;
  }

  const n=Number(value);
  return Number.isFinite(n)&&n>=0?n:null;
}

function parseDate(value){
  if(!value)return null;

  const date=new Date(value);

  return Number.isNaN(date.getTime())
    ?null
    :date;
}

function formatDate(date){
  return date.toLocaleDateString('bg-BG',{
    timeZone:'UTC',
    day:'2-digit',
    month:'2-digit',
    year:'numeric'
  });
}

function createHistoryIndex(data){
  const byId=new Map();
  const byName=new Map();

  const entries=Array.isArray(data.items)
    ?data.items
    :[];

  for(const entry of entries){
    if(!entry||!entry.itemKey)continue;

    const key=String(entry.itemKey);

    if(key.startsWith('fn:item:')){
      const id=normalize(key.slice(8));
      if(id)byId.set(id,entry);
    }

    const name=normalize(entry.name);

    if(name){
      if(!byName.has(name)){
        byName.set(name,[]);
      }
      byName.get(name).push(entry);
    }
  }

  return {
    byId,
    byName,
    count:entries.length,
    updatedAt:data.updatedAt||null,
    scope:data.scope||null
  };
}

async function getHistory(){
  if(!historyPromise){
    historyPromise=fetch(
      './item-history.json?v='+Date.now(),
      {cache:'no-store'}
    )
    .then(response=>{
      if(!response.ok){
        throw new Error(
          'History HTTP '+response.status
        );
      }
      return response.json();
    })
    .then(createHistoryIndex)
    .catch(error=>{
      console.error('History:',error);
      historyPromise=null;
      return null;
    });
  }

  return historyPromise;
}

function findHistory(item,history){
  if(!history)return null;

  const id=normalize(item.id);

  if(history.byId.has(id)){
    return history.byId.get(id);
  }

  // Резервно търсене по име само при
  // един-единствен съвпадащ запис.
  const name=normalize(item.name);
  const matches=history.byName.get(name)||[];

  if(matches.length===1){
    return matches[0];
  }

  return null;
}

function cosmeticLastDate(item){
  const dates=[];

  if(item.lastAppearance){
    const date=parseDate(item.lastAppearance);
    if(date)dates.push(date);
  }

  if(Array.isArray(item.shopHistory)){
    for(const value of item.shopHistory){
      const date=parseDate(value);
      if(date)dates.push(date);
    }
  }

  dates.sort((a,b)=>b-a);

  return dates[0]||null;
}

function renderItem(item,history){
  const card=add(results,'article','');
  card.className='card';

  const image=
    item.images?.featured||
    item.images?.icon||
    item.images?.smallIcon;

  if(image){
    const img=document.createElement('img');
    img.src=image;
    img.alt=item.name||'Fortnite предмет';
    img.loading='lazy';
    card.appendChild(img);
  }

  const info=add(card,'div','');
  info.className='info';

  add(
    info,'h2',
    item.name||'Неизвестен предмет'
  );

  const type=normalize(item.type?.value);

  add(
    info,'p',
    'Категория: '+(
      typeNames[type]||
      item.type?.displayValue||
      'Друга'
    ),
    'type'
  );

  add(
    info,'p',
    'Рядкост: '+(
      item.series?.name||
      item.rarity?.displayValue||
      'Неизвестна'
    )
  );

  if(item.description){
    add(info,'p',item.description);
  }

  const record=findHistory(item,history);
  const price=validPrice(record?.price);
  const currency=normalize(record?.currency);
  const isBundle=String(
    record?.itemKey||''
  ).startsWith('fn:bundle:');

  if(price!==null &&
     (currency==='v-bucks'||currency==='vbucks')){
    add(
      info,'p',
      '🪙 Последна записана цена: '+
      price.toLocaleString('en-US')+
      ' V-Bucks'+
      (isBundle?' (пакет)':''),
      'price'
    );
  }else{
    add(
      info,'p',
      '🪙 Цена: няма записана цена',
      'warning'
    );
  }

  const historyDate=parseDate(
    record?.lastAppearance
  );

  const cosmeticDate=cosmeticLastDate(item);

  let last=null;
  let source='';

  if(historyDate&&cosmeticDate){
    if(historyDate>=cosmeticDate){
      last=historyDate;
      source='архив';
    }else{
      last=cosmeticDate;
      source='Fortnite-API';
    }
  }else if(historyDate){
    last=historyDate;
    source='архив';
  }else if(cosmeticDate){
    last=cosmeticDate;
    source='Fortnite-API';
  }

  if(last){
    add(
      info,'p',
      '📅 Последна записана поява: '+
      formatDate(last),
      'last'
    );

    add(
      info,'p',
      'Източник: '+source
    );

    const days=Math.floor(
      (Date.now()-last.getTime())/86400000
    );

    if(days>=0){
      add(
        info,'p',
        '⏳ Преди '+days+' дни'
      );
    }
  }else{
    add(
      info,'p',
      '📅 Последна поява: няма запис',
      'warning'
    );
  }

  if(item.introduction?.text){
    add(
      info,'p',
      item.introduction.text
    );
  }
}

async function searchItems(query){
  if(controller)controller.abort();

  controller=new AbortController();
  const signal=controller.signal;

  results.replaceChildren();
  statusEl.textContent='⏳ Търсене...';

  const params=new URLSearchParams({
    name:query,
    matchMethod:'contains',
    language:'en',
    searchLanguage:'en'
  });

  if(category.value){
    params.set('type',category.value);
  }

  try{
    const response=await fetch(
      'https://fortnite-api.com/v2/cosmetics/br/search/all?'+params,
      {signal}
    );

    if(response.status===404){
      statusEl.textContent='Няма намерени предмети.';
      return;
    }

    if(!response.ok){
      throw new Error(
        'Search HTTP '+response.status
      );
    }

    const json=await response.json();

    const items=Array.isArray(json.data)
      ?json.data
      :[];

    if(signal.aborted)return;

    if(!items.length){
      statusEl.textContent='Няма намерени предмети.';
      return;
    }

    statusEl.textContent=
      '⏳ Зареждане на история и цени...';

    const history=await getHistory();

    if(signal.aborted)return;

    results.replaceChildren();

    items.slice(0,80).forEach(
      item=>renderItem(item,history)
    );

    let message=
      '🎮 Намерени предмети: '+items.length;

    if(items.length>80){
      message+=' (показани първите 80)';
    }

    if(history){
      message+=
        ' · Исторически записи: '+
        history.count;

      if(history.updatedAt){
        const updated=parseDate(
          history.updatedAt
        );

        if(updated){
          message+=
            ' · Обновено: '+
            formatDate(updated);
        }
      }
    }else{
      message+=
        ' · ⚠️ item-history.json не е достъпен';
    }

    statusEl.textContent=message;

  }catch(error){
    if(error.name==='AbortError')return;

    console.error(error);

    statusEl.textContent=
      '❌ Грешка при търсене. Опитай отново.';
  }
}

form.addEventListener('submit',event=>{
  event.preventDefault();

  const query=input.value.trim();

  if(query.length>=2){
    searchItems(query);
  }
});
</script>
</body>
</html>
