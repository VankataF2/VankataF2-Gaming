
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortnite Item Search | VANKATA GAMING</title>
<style>
:root{
  --bg:#090b17;
  --panel:#171e35;
  --cyan:#29e0e7;
  --purple:#9560ff;
  --muted:#b2b7cc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:35px 16px;background:#141a30;border-bottom:1px solid #394164}
h1{font-size:clamp(27px,5vw,43px);margin:10px 0}
header p,.note{color:var(--muted)}
a{color:var(--cyan)}
main{max-width:1200px;margin:auto;padding:28px 16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:25px}
input,select{
  background:#202943;color:white;border:1px solid #495377;
  padding:15px;border-radius:12px;font-size:16px
}
input{flex:1;min-width:190px}
button{
  padding:15px 23px;
  background:linear-gradient(120deg,#9560ff,#5555ee);
  color:white;border:0;border-radius:12px;
  font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(1.15)}
#status{color:var(--muted);text-align:center;margin:22px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:19px
}
.card{
  background:var(--panel);
  border:1px solid #37415d;
  border-radius:17px;
  overflow:hidden
}
.card img{
  display:block;width:100%;height:235px;object-fit:contain;
  background:radial-gradient(circle,#39305d,#14192b)
}
.info{padding:17px}
.info h2{font-size:20px;margin:0 0 10px}
.info p{font-size:14px;color:#c5cce0;line-height:1.5}
.type{color:var(--cyan)!important;font-weight:bold}
.price{color:#ffe59a!important;font-weight:bold}
.last{color:#a8ffcc!important;font-weight:bold}
.note{text-align:center;font-size:13px;line-height:1.6;margin-top:30px}
@media(max-width:550px){
  .controls{flex-direction:column}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card img{height:170px}
  .info{padding:11px}
  .info h2{font-size:16px}
}
</style>
</head>
<body>
<header>
  <h1>🔍 FORTNITE ITEM SEARCH</h1>
  <p>Скинове, кирки, емоути, раници и още!</p>
  <a href="./index.html">← VANKATA GAMING</a>
</header>

<main>
<form id="searchForm" class="controls">
  <input id="itemName"
         placeholder="Например: Midas, Aura, Star Wand..."
         minlength="2" required>
  <select id="category">
    <option value="">🎮 Всички категории</option>
    <option value="outfit">👕 Скинове</option>
    <option value="pickaxe">⛏️ Кирки</option>
    <option value="backbling">🎒 Раници</option>
    <option value="emote">💃 Емоути</option>
    <option value="glider">🪂 Глайдери</option>
    <option value="wrap">🔫 Wraps</option>
    <option value="music">🎵 Музика</option>
  </select>
  <button type="submit">🔍 Търси</button>
</form>

<p id="status" aria-live="polite">Въведи име на предмет.</p>
<div id="results" class="grid"></div>

<p class="note">
  Данни от Fortnite-API и публичния архив Fortnite-Datamining.
  Историческите цени може да са цени на оферти или пакети,
  а не самостоятелна цена на предмета.
  Непълните записи се обозначават.
</p>
</main>

<script>
'use strict';

const form=document.getElementById('searchForm');
const input=document.getElementById('itemName');
const category=document.getElementById('category');
const results=document.getElementById('results');
const statusEl=document.getElementById('status');

const typeNames={
  outfit:'Скин',
  pickaxe:'Кирка',
  backbling:'Раница',
  emote:'Емоут',
  glider:'Глайдер',
  wrap:'Wrap',
  music:'Музика'
};

const registryUrl=
  'https://raw.githubusercontent.com/Fortnite-Datamining/Fortnite-Datamining/main/data/items/registry.json';

let controller=null;
let shopPromise=null;
let registryPromise=null;

function add(parent,tag,value,cls){
  const el=document.createElement(tag);
  el.textContent=value;
  if(cls)el.className=cls;
  parent.appendChild(el);
  return el;
}

function dateOf(v){
  if(v==null||v==='')return null;

  if(typeof v==='object'){
    return dateOf(
      v.date??v.day??v.shopDate??
      v.timestamp??v.time??v.appearanceDate
    );
  }

  const n=typeof v==='number'
    ?v
    :(/^\d{10,13}$/.test(String(v))?Number(v):NaN);

  const d=Number.isFinite(n)
    ?new Date(n<1e11?n*1000:n)
    :new Date(v);

  return Number.isFinite(d.getTime())?d:null;
}

function money(v){
  const n=Number(v);
  return v!==null&&v!==undefined&&v!==''&&
    Number.isFinite(n)&&n>=0?n:null;
}

function priceOf(x){
  if(!x||typeof x!=='object')return null;
  return money(
    x.finalPrice??x.price??x.vbucks??
    x.vBucks??x.regularPrice??x.cost
  );
}

function getHistory(entry){
  if(!entry||typeof entry!=='object')return [];

  const candidates=[
    entry.shopAppearances,
    entry.shopHistory,
    entry.appearances,
    entry.history,
    entry.shops,
    entry.shop_history,
    entry.shop_appearances
  ];

  const out=[];

  for(const candidate of candidates){
    if(Array.isArray(candidate)){
      out.push(...candidate);
    }else if(candidate&&typeof candidate==='object'){
      for(const [key,value] of Object.entries(candidate)){
        if(dateOf(key)){
          out.push(
            typeof value==='object'&&value!==null
              ?{date:key,...value}
              :{date:key,price:value}
          );
        }
      }
    }
  }
  return out;
}

function registryRecord(registry,item){
  if(!registry)return null;

  const roots=[
    registry,
    registry.items,
    registry.cosmetics,
    registry.data,
    registry.registry,
    registry.entries
  ].filter(Boolean);

  const id=String(item.id||'').toLowerCase();

  for(const root of roots){
    if(Array.isArray(root)){
      const match=root.find(x=>
        x&&String(
          x.id??x.itemId??x.cosmeticId??''
        ).toLowerCase()===id
      );
      if(match)return match;
    }else if(typeof root==='object'){
      if(root[item.id])return root[item.id];

      const key=Object.keys(root).find(
        k=>k.toLowerCase()===id
      );
      if(key)return root[key];
    }
  }
  return null;
}

function historicalInfo(item,registry){
  const rec=registryRecord(registry,item);
  const history=[
    ...getHistory(rec),
    ...getHistory(item)
  ];

  const appearances=[];

  for(const h of history){
    const date=dateOf(h);
    if(date){
      appearances.push({
        date,
        price:priceOf(h)
      });
    }
  }

  for(const v of [
    item.lastAppearance,
    rec?.lastAppearance,
    rec?.lastSeenInShop,
    rec?.lastShopAppearance,
    rec?.last_shop_appearance
  ]){
    const date=dateOf(v);
    if(date){
      appearances.push({date,price:null});
    }
  }

  appearances.sort((a,b)=>b.date-a.date);

  const last=appearances[0]?.date||null;
  const priced=appearances.find(x=>x.price!==null);

  const standalone=money(
    rec?.lastKnownPrice??
    rec?.lastPrice??
    rec?.shopPrice??
    rec?.price
  );

  return {
    last,
    price:priced?.price??standalone,
    priceDate:priced?.date||null,
    hasHistory:history.length>0
  };
}

async function fetchJson(url,signal){
  const r=await fetch(url,{signal});
  if(!r.ok){
    throw new Error('HTTP '+r.status+' '+url);
  }
  return r.json();
}

function getShop(){
  if(!shopPromise){
    shopPromise=fetchJson(
      'https://fortnite-api.com/v2/shop'
    ).then(j=>{
      const map=new Map();

      for(const e of j.data?.entries||[]){
        const p=money(
          e.finalPrice??e.regularPrice
        );

        for(const it of [
          ...(e.brItems||[]),
          ...(e.tracks||[]),
          ...(e.instruments||[]),
          ...(e.cars||[])
        ]){
          if(!it?.id||p===null)continue;

          const prev=map.get(it.id);

          if(!prev||p<prev.price){
            map.set(it.id,{
              price:p,
              count:(e.brItems||[]).length
            });
          }
        }
      }
      return map;
    }).catch(e=>{
      console.warn('Shop:',e);
      shopPromise=null;
      return new Map();
    });
  }
  return shopPromise;
}

function getRegistry(){
  if(!registryPromise){
    registryPromise=fetchJson(registryUrl)
      .catch(e=>{
        console.warn('Registry:',e);
        registryPromise=null;
        return null;
      });
  }
  return registryPromise;
}

function renderItem(item,shop,registry){
  const card=add(results,'article','');
  card.className='card';

  const image=
    item.images?.featured||
    item.images?.icon||
    item.images?.smallIcon;

  if(image){
    const img=document.createElement('img');
    img.src=image;
    img.alt=item.name||'Fortnite предмет';
    img.loading='lazy';
    card.appendChild(img);
  }

  const info=add(card,'div','');
  info.className='info';

  add(info,'h2',item.name||'Неизвестен предмет');

  const type=String(
    item.type?.value||''
  ).toLowerCase();

  add(
    info,'p',
    'Категория: '+(
      typeNames[type]||
      item.type?.displayValue||
      'Друга'
    ),
    'type'
  );

  add(
    info,'p',
    'Рядкост: '+(
      item.series?.name||
      item.rarity?.displayValue||
      'Неизвестна'
    )
  );

  if(item.description){
    add(info,'p',item.description);
  }

  const offer=shop.get(item.id);
  const hist=historicalInfo(item,registry);

  if(offer){
    add(
      info,'p',
      '🪙 Текуща оферта: '+
      offer.price.toLocaleString('en-US')+
      ' V-Bucks'+(
        offer.count>1?' (може да е пакет)':''
      ),
      'price'
    );

    add(
      info,'p',
      '🟢 В текущия Item Shop'
    );

  }else if(hist.price!==null){
    add(
      info,'p',
      '🪙 Историческа цена на оферта: '+
      hist.price.toLocaleString('en-US')+
      ' V-Bucks (възможен пакет)',
      'price'
    );

  }else{
    add(
      info,'p',
      '🪙 Цена: няма надеждни данни'
    );
  }

  if(hist.last){
    add(
      info,'p',
      '📅 Последна записана поява: '+
      hist.last.toLocaleDateString(
        'bg-BG',{
          timeZone:'UTC',
          day:'2-digit',
          month:'2-digit',
          year:'numeric'
        }
      ),
      'last'
    );

    const days=Math.floor(
      (Date.now()-hist.last.getTime())/86400000
    );

    if(days>=0){
      add(
        info,'p',
        '⏳ Преди '+days+' дни'
      );
    }

  }else{
    add(
      info,'p',
      '📅 Последна поява: няма данни'
    );
  }

  if(item.introduction?.text){
    add(
      info,'p',
      item.introduction.text
    );
  }
}

async function searchItems(query){
  if(controller)controller.abort();

  controller=new AbortController();
  const signal=controller.signal;

  results.replaceChildren();
  statusEl.textContent='⏳ Търсене...';

  const params=new URLSearchParams({
    name:query,
    matchMethod:'contains',
    language:'en',
    searchLanguage:'en'
  });

  if(category.value){
    params.set('type',category.value);
  }

  try{
    const response=await fetch(
      'https://fortnite-api.com/v2/cosmetics/br/search/all?'+params,
      {signal}
    );

    if(response.status===404){
      statusEl.textContent='Няма намерени предмети.';
      return;
    }

    if(!response.ok){
      throw new Error(
        'Search HTTP '+response.status
      );
    }

    const j=await response.json();

    const items=Array.isArray(j.data)
      ?j.data
      :[];

    if(signal.aborted)return;

    if(!items.length){
      statusEl.textContent='Няма намерени предмети.';
      return;
    }

    statusEl.textContent=
      '⏳ Зареждане на история и цени...';

    const [shop,registry]=await Promise.all([
      getShop(),
      getRegistry()
    ]);

    if(signal.aborted)return;

    results.replaceChildren();

    items.slice(0,80).forEach(
      item=>renderItem(item,shop,registry)
    );

    statusEl.textContent=
      '🎮 Намерени предмети: '+items.length+
      (items.length>80
        ?' (показани първите 80)'
        :'')+
      (!registry
        ?' · Историческият архив е недостъпен'
        :'');
  }catch(e){
    if(e.name==='AbortError')return;

    console.error(e);

    statusEl.textContent=
      '❌ Грешка при търсене. Опитай отново.';
  }
}

form.addEventListener('submit',e=>{
  e.preventDefault();

  const q=input.value.trim();

  if(q.length>=2){
    searchItems(q);
  }
});
</script>
</body>
</html>
